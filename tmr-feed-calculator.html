<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMR Feed Calculator – Total Mixed Ration | Calcora</title><meta name="description" content="Calculate ingredient quantities for a target total mixed ration using percentages with Calcora's free TMR Feed Calculator."><link rel="canonical" href="https://azeemwaseem2020.github.io/calcora-tool.github.io/tmr-feed-calculator.html"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="./">Calcora</a><nav><a href="./#calculators">Calculators</a></nav></header><main class="section prose"><p class="eyebrow">AGRICULTURE CALCULATOR</p><h1>TMR Feed Calculator</h1><p class="lead">Calculate ingredient quantities from a target total mixed ration.</p><div class="hero-card"><label>Target TMR (kg) <input id="total" type="number" value="100" min="0"></label><br><label>Ingredient percentage (%) <input id="pct" type="number" value="25" min="0" max="100" step="0.1"></label><br><button class="btn" onclick="go()">Calculate</button><div id="out" aria-live="polite"></div></div><p>Use the percentage of the complete ration for each ingredient. Feed formulation should be checked by a qualified animal nutrition professional.</p></main><script>function go(){let T=+total.value,P=+pct.value;out.innerHTML='<h2>Result</h2><p><strong>Ingredient quantity:</strong> '+(T*P/100).toFixed(2)+' kg</p>'}go()</script></body></html>
