<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compound Interest Calculator | Calcora</title><meta name="description" content="Free compound interest calculator. Estimate future value, interest earned and growth over time."><link rel="canonical" href="https://azeemwaseem2020.github.io/calcora-tool.github.io/compound-interest-calculator.html"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><meta name="robots" content="index,follow"></head><body><header class="site-header"><a class="brand" href="./">Calcora</a><nav><a href="./#calculators">Calculators</a></nav></header><main class="section prose"><p class="eyebrow">FINANCE CALCULATOR</p><h1>Compound Interest Calculator</h1><p class="lead">Estimate how an investment or savings balance can grow with compound interest.</p><div class="hero-card"><label>Initial amount <input id="p" type="number" value="10000" min="0"></label><br><label>Annual rate (%) <input id="r" type="number" value="8" min="0" step="0.01"></label><br><label>Years <input id="t" type="number" value="10" min="0" step="1"></label><br><label>Compounds per year <input id="n" type="number" value="12" min="1"></label><br><button class="btn" onclick="go()">Calculate</button><div id="out" aria-live="polite"></div></div><h2>Formula</h2><p>Future value = principal × (1 + annual rate ÷ compounds) raised to the number of compounding periods.</p></main><script>function go(){let P=+p.value,R=+r.value/100,T=+t.value,N=+n.value;let A=P*Math.pow(1+R/N,N*T);out.innerHTML='<h2>Result</h2><p><strong>Future value:</strong> '+A.toFixed(2)+'</p><p><strong>Interest earned:</strong> '+(A-P).toFixed(2)+'</p>'}go()</script></body></html>
