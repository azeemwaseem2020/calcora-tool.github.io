<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fertilizer Calculator – Application Rate | Calcora</title><meta name="description" content="Estimate fertilizer quantity from field area and application rate with Calcora's free Fertilizer Calculator."><link rel="canonical" href="https://azeemwaseem2020.github.io/calcora-tool.github.io/fertilizer-calculator.html"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="./">Calcora</a><nav><a href="./#calculators">Calculators</a></nav></header><main class="section prose"><p class="eyebrow">AGRICULTURE CALCULATOR</p><h1>Fertilizer Calculator</h1><p class="lead">Estimate fertilizer required from field area and application rate.</p><div class="hero-card"><label>Field area (hectares) <input id="a" type="number" value="1" min="0" step="0.01"></label><br><label>Application rate (kg/ha) <input id="r" type="number" value="100" min="0" step="0.1"></label><br><button class="btn" onclick="go()">Calculate</button><div id="out" aria-live="polite"></div></div><p>Enter the recommended application rate for your crop and soil. Always follow the fertilizer product label and local agronomic advice.</p></main><script>function go(){let A=+a.value,R=+r.value;out.innerHTML='<h2>Result</h2><p><strong>Fertilizer required:</strong> '+(A*R).toFixed(2)+' kg</p>'}go()</script></body></html>
